name: 更新と通知

on:
  schedule:
    - cron: "7,27,47 23,0-5 * * *"    # 日本時間 8時〜15時(試合が終わる時間帯)は20分おき:データ更新
    - cron: "17 6-22 * * *"            # それ以外は毎時:データ更新
    - cron: "40 23,2,5,8,11 * * *"    # 日本時間 8:40/11:40/14:40/17:40/20:40:更新(通知の時間の少し前にも回す)
    # 通知(9・12・15・18・21時)は「その時間の通知をまだ送っていなければ、8:40などを過ぎて最初に動いた回が送る」。
    # GitHubの定期実行は遅れたり抜けたりするので、特定の回に頼らない(notify_state.json で同じ時間に2回送らない)
  push:                               # アプリやスクリプト・設定を直したらすぐ反映
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/*.py"
      - "scripts/*.json"        # 設定・エース表・小話(events/receptions/names_ja/coach_ties)・昨季の点数など。ボットの自動コミットでは動かない
      - "scripts/*.js"
      - "scripts/tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      notify:
        description: "通知も送る? (yes/no)"
        default: "no"
      remeasure:
        description: "余韻を全部測り直す? (yes/no)"
        default: "no"
      auto:
        description: "定期の回と同じ動き(試合前の通知・その時間の通知)をする? 見張り番(watch.yml)が yes で動かす"
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ネタバレ防止:スクリプトは試合の中身をログに出さない
      # 取ったESPNのデータと前回の記録を保存・使い回す(毎時の取り直しを軽くし、取れなかった試合は前回の記録で埋める)
      - uses: actions/cache@v6
        with:
          path: |
            scripts/cache
            scripts/archive.json
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: みんなからの投稿を集める
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: cd scripts && (python inbox.py || echo "inbox.py failed (続行)")

      # 採点のテスト。失敗したらここで止まり、アプリは前の状態のまま(壊れた採点を出さない)
      - name: 採点のテスト
        run: cd scripts && python tests/run_tests.py

      - name: データ収集と採点
        id: collect
        run: |
          cd scripts
          EXTRA=""
          if [ "${{ github.event.inputs.remeasure }}" = "yes" ]; then EXTRA="--remeasure"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.auto }}" = "yes" ]; then EXTRA="$EXTRA --prenotify --notify-auto"; fi
          if [ "${{ github.event.inputs.notify }}" = "yes" ]; then EXTRA="$EXTRA --notify-now"; fi
          OUT_DIR=../docs python collect.py --rebuild $EXTRA

      - name: 公式Bluesky(月末の決選投票・毎日の速報)
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          cd scripts
          python vote.py || echo "vote.py failed (続行)"
          python bsky_daily.py || echo "bsky_daily.py failed (続行)"

      - name: 通知(ntfy)
        if: hashFiles('scripts/notify_now') != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC が未設定なので通知はスキップ"; exit 0; fi
          curl -s -o /dev/null -w "ntfy %{http_code}\n" \
            -H "Title: NBA Navi" -H "Tags: basketball" \
            -H "Click: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --data-binary @scripts/notify.txt "https://ntfy.sh/$NTFY_TOPIC"

      - name: 通知(みんな用:推しチーム別チャンネル)
        if: hashFiles('scripts/notify_now') != ''
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          cfg = json.load(open("scripts/config.json"))
          ch = json.load(open("scripts/notify_channels.json"))
          ok = 0
          for key, text in ch.items():
              req = urllib.request.Request("https://ntfy.sh/" + cfg["public_topic_prefix"] + key, data=text.encode(),
                    headers={"Title": "NBA Navi", "Tags": "basketball", "Click": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"})
              try:
                  urllib.request.urlopen(req, timeout=20); ok += 1
              except Exception as e:
                  print("failed:", key, type(e).__name__)
              time.sleep(1)
          print(f"sent {ok}/{len(ch)} channels")
          PY

      - name: 試合前の通知(🔥・★3の試合+そのチャンネルの推しの試合が始まる前)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ ! -s scripts/prenotify.json ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, time, urllib.request
          cfg = json.load(open("scripts/config.json"))
          texts = json.load(open("scripts/prenotify.json"))
          ok = 0
          for key, text in texts.items():
              t = (os.environ.get("NTFY_TOPIC") or "") if key == "_owner" else cfg["public_topic_prefix"] + key
              if not t:
                  continue
              req = urllib.request.Request("https://ntfy.sh/" + t, data=text.encode(),
                    headers={"Title": "NBA Navi(まもなく開始)", "Tags": "fire", "Click": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"})
              try:
                  urllib.request.urlopen(req, timeout=20); ok += 1
              except Exception as e:
                  print("failed:", type(e).__name__)
              time.sleep(1)
          print(f"prenotify sent {ok}/{len(texts)}")
          PY

      - name: 持ち主への知らせ(測定の見張り・エース表の見直し)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ ! -s scripts/alert.txt ] || [ -z "$NTFY_TOPIC" ]; then exit 0; fi
          curl -s -o /dev/null -w "alert %{http_code}\n" -H "Title: NBA Navi(持ち主へ)" -H "Tags: warning" \
            --data-binary @scripts/alert.txt "https://ntfy.sh/$NTFY_TOPIC"

      - name: 余韻の記録を保存
        run: |
          git config user.name "nba-navi-bot"
          git config user.email "nba-navi-bot@users.noreply.github.com"
          git add scripts/buzz_state.json
          git add scripts/clip_hist.json 2>/dev/null || true
          git add scripts/alert_state.json 2>/dev/null || true
          git add scripts/ratings.json 2>/dev/null || true
          git add -A scripts/votes 2>/dev/null || true
          git add scripts/upgrades.json 2>/dev/null || true
          git add scripts/suggestions.json 2>/dev/null || true
          git add scripts/bsky_state.json 2>/dev/null || true
          git add scripts/prenotify_state.json 2>/dev/null || true
          git add scripts/notify_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "余韻・決選投票の記録を更新"
          # 別の回と同時に記録を書いてぶつかったときは、この回の記録を優先して入れ直す(何回か試す)
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

      # 記録の保存に失敗しても、採点まで終わっていれば画面は新しくする
      - uses: actions/configure-pages@v6
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        with:
          path: docs
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
