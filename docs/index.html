<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA 観戦ナビ</title>
<meta name="description" content="NBAの試合をネタバレなしで「見るべきか」教えてくれるアプリ。結果はボタンを押すまで出ない。">
<meta property="og:title" content="NBA 観戦ナビ">
<meta property="og:description" content="ネタバレなしで「この試合は見るべきか」がわかる。ランク(SS〜C)・欠場情報・推しチーム設定・通知つき。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tak0913.github.io/nba-navi/">
<meta property="og:image" content="https://tak0913.github.io/nba-navi/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="観戦ナビ">
<meta name="theme-color" content="#0f1115">
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --line:#2b303b; --text:#e9ecf1; --sub:#9aa3b2;
  --ss:#f5c542; --s:#ff6b4a; --a:#4aa8ff; --b:#7bd389; --c:#8a93a3;
  --out:#ff5a5a; --q:#ffb547; --p:#7bd389;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 4px}
.top h1{font-size:18px;margin:0;letter-spacing:.02em}
.top .upd{font-size:11px;color:var(--sub)}
nav{display:flex;gap:4px;padding:6px 10px 10px;overflow-x:auto}
nav button{flex:none;background:var(--panel);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
nav button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
main{padding:12px 12px 60px;max-width:720px;margin:0 auto}
.days{display:flex;gap:6px;margin-bottom:12px}
.days button{flex:1;background:var(--panel);color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px}
.days button.on{border-color:var(--text);color:var(--text);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card .head{padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.badge{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;border:2px solid currentColor}
.badge.SS{color:var(--ss);box-shadow:0 0 14px rgba(245,197,66,.35)} .badge.S{color:var(--s)} .badge.A{color:var(--a)} .badge.B{color:var(--b)} .badge.C{color:var(--c)}
.badge.none{color:#4a505c;font-size:13px} .badge.exp{color:var(--sub);font-size:12px;line-height:1.1;text-align:center}
.badge.fav{color:#c792ea;font-size:11px;line-height:1.4}
.favnote{margin-top:6px;font-size:12px;line-height:1.5;color:#d7b8f3;background:rgba(199,146,234,.10);border:1px solid rgba(199,146,234,.35);border-radius:8px;padding:6px 8px}
.match{flex:1;min-width:0}
.match .teams{font-weight:700;font-size:16px}
.match .teams .at{color:var(--sub);font-weight:400;margin:0 6px}
.match .meta{font-size:12px;color:var(--sub)}
.state{flex:none;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--sub)}
.state.in{color:#ff6b4a}
.quick{padding:0 14px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.quick .row{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.quick .tm{color:var(--sub);width:42px;flex:none}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--panel2)}
.chip.out{color:var(--out)} .chip.q{color:var(--q)} .chip.p{color:var(--p)}
.body{display:none;border-top:1px solid var(--line);padding:12px 14px}
.card.open .body{display:block}
h3{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
h3:first-child{margin-top:0}
.rosters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roster .ttl{font-weight:700;margin-bottom:4px}
.roster .ttl small{color:var(--sub);font-weight:400}
.pl{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pl .no{color:var(--sub);display:inline-block;width:24px}
.pl .tier{white-space:nowrap;font-size:10px;padding:0 4px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tier.mvp{background:var(--ss);color:#000} .tier.allstar{background:var(--a);color:#000} .tier.ace{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.pl .st{display:block;font-size:11px;margin-left:24px}
.str{font-size:13px;margin:2px 0}
.reveal{margin-top:14px}
.reveal.top{display:block;margin:0;padding:0 14px 10px;min-width:0}
.result{min-width:0;max-width:100%}
.boxwrap table td:first-child,.boxwrap table th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 28px);margin:2px 14px 12px;background:rgba(74,168,255,.10);border:1px solid rgba(74,168,255,.45);border-radius:10px;color:var(--a);font-size:14px;font-weight:700;padding:10px 14px;cursor:pointer}
.more:active{background:rgba(74,168,255,.2)}
.card.open .more{background:var(--panel2);border-color:var(--line);color:var(--sub)}
.more .c{display:none} .card.open .more .o{display:none} .card.open .more .c{display:inline}
.more .chev{display:inline-block;transition:transform .2s;font-size:12px} .card.open .more .chev{transform:rotate(180deg)}
.btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-weight:600}
.btn.warn{border-color:#ff6b4a;color:#ff6b4a}
.btn.fav{border-color:rgba(199,146,234,.6);color:#d7b8f3;margin-bottom:8px}
.confirm{display:none;margin-top:8px;padding:12px;border-radius:10px;background:#2a1714;border:1px solid #5a2a22;font-size:14px}
.confirm .acts{display:flex;gap:8px;margin-top:10px}
.confirm .acts button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;font-size:14px}
.yes{background:#ff6b4a;color:#000} .no{background:var(--panel2);color:var(--text)}
.result{display:none;margin-top:12px}
.bd{margin:6px 0 14px}
.bdtotal{font-size:15px;margin:4px 0 8px} .bdtotal b{font-size:20px}
.bd details{border-bottom:1px solid var(--line)}
.bd summary{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;cursor:pointer;font-size:14px;list-style:none}
.bd summary::-webkit-details-marker{display:none}
.bd summary span::before{content:"▸ ";color:var(--sub)} .bd details[open] summary span::before{content:"▾ "}
.bd summary small{color:var(--sub);font-weight:400}
.bd ul{margin:0 0 8px;padding-left:20px;font-size:12.5px;color:var(--sub);line-height:1.6}
.final{display:flex;justify-content:center;gap:18px;align-items:center;font-size:28px;font-weight:800;margin:6px 0 10px}
.final span small{display:block;font-size:12px;color:var(--sub);font-weight:400;text-align:center}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--sub);font-weight:500}
.boxwrap{overflow-x:auto;margin-bottom:10px}
.dnp{color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.list .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.list .item .badge{width:40px;height:40px;font-size:16px}
.list .item .d{font-size:12px;color:var(--sub)}
.legend{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.legend b{color:var(--text)}
.aces .team{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.aces .team .n{font-weight:700;margin-bottom:4px}
.aces .team .p{font-size:13px;margin:2px 0}
.fav-on{color:#c792ea}
.set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px}
.set h4{margin:0 0 8px;font-size:15px}
.set select{width:100%;font-size:16px;padding:10px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.set .topic{display:flex;gap:8px;align-items:center;margin:8px 0}
.set code{flex:1;background:var(--panel2);padding:10px;border-radius:8px;font-size:14px;word-break:break-all}
.set .copy{padding:10px 14px;border-radius:8px;border:none;background:var(--text);color:var(--bg);font-weight:700}
.set textarea,.set input[type=text]{width:100%;font-size:16px;padding:10px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-family:inherit}
.set label{display:block;margin:10px 0 4px;color:var(--sub);font-size:13px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:14px}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}
.set ol{margin:6px 0 0;padding-left:20px;color:var(--sub);font-size:13px}
.ob{position:fixed;inset:0;z-index:50;background:rgba(5,6,9,.92);display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.ob .box{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px 20px 18px}
.ob .step{color:var(--sub);font-size:12px;margin-bottom:6px}
.ob h2{margin:0 0 12px;font-size:20px}
.ob p,.ob li{font-size:14px;line-height:1.65}
.ob ul{padding-left:18px;margin:8px 0}
.ob .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 10px}
.ob .dots i{width:7px;height:7px;border-radius:50%;background:#3a404c}
.ob .dots i.on{background:var(--text)}
.ob .acts{display:flex;gap:8px}
.ob .acts button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;font-weight:700}
.ob .acts button.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.ob .skip{display:block;margin:10px auto 0;background:none;border:none;color:var(--sub);font-size:13px}
.ob .tierrow{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.ob .tierrow .badge{width:34px;height:34px;font-size:13px}
.banner{background:#1d2433;border:1px solid #33415c;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner button{margin-left:6px;padding:4px 10px;border-radius:8px;border:none;background:var(--a);color:#000;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🏀 NBA 観戦ナビ</h1><span class="upd" id="upd"></span></div>
  <nav id="nav">
    <button data-v="day" class="on">試合</button>
    <button data-v="tiers">ティア表</button>
    <button data-v="hall">殿堂</button>
    <button data-v="aces">エース表</button>
    <button data-v="help">使い方</button>
    <button data-v="post">投稿</button>
    <button data-v="settings">設定</button>
  </nav>
</header>
<main id="main"><div class="empty">読み込み中…</div></main>
<div class="ob" id="ob" style="display:none"><div class="box" id="obbox"></div></div>

<script src="tiers.js?v=1"></script>
<script>
const APP_VER="2026-11-03f";   // 画面を直したら変える。データ側と違ったら自動で読み込み直す(ホーム画面のアプリが古い画面のままになるのを防ぐ)
let DATA=null, view="day", dayIdx=0, scope="week", stype="regular", period=null, showAll=false;
let FAV="", VISIBLE=[];
const TIER_SHORT={mvp:"MVP級",allstar:"AS級",ace:"エース"};
const TIER_JA={mvp:"MVP級",allstar:"オールスター級",ace:"エース"};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wd=d=>["日","月","火","水","木","金","土"][new Date(d+"T00:00:00Z").getUTCDay()];
const md=d=>{const [y,m,dd]=d.split("-");return `${+m}/${+dd}(${wd(d)})`};

// ---- 推しチーム(このスマホにだけ保存) ----
function loadFav(){
  FAV=store.get("fav")||"";
  try{const q=new URLSearchParams(location.search).get("fav");
    if(q!==null){FAV=q.toUpperCase()==="NONE"?"":q.toUpperCase();store.set("fav",FAV);store.set("fav_set","1")}}catch(e){}
}
function isHidden(r){
  if(!FAV||(r.home!==FAV&&r.away!==FAV)) return false;
  // 自分で見終わった(または結果を開いた)推しの試合は、もう隠さない
  if(store.get("watched_"+r.id)==="1"||store.get("seen_"+r.id)==="1") return false;
  // 終わった時刻はデータに入れていない(延長のヒントになるので)。始まった時刻+余裕+24時間で数える
  if(!r.start_utc) return true;
  return Date.now() < Date.parse(r.start_utc)+(DATA.fav_hide_hours+(DATA.fav_hide_pad_hours??3))*3600e3;
}
// ---- ランク付け(計算は tiers.js。サーバーの通知づくりも同じファイルを使う。推しを除いてこのスマホで計算) ----
const weekStart=Tiers.weekStart, daysBetween=Tiers.daysBetween;
function computeTiers(){
  VISIBLE=DATA.archive.filter(r=>!isHidden(r));
  DATA.archive.forEach(r=>{r.tier=null;r.ss_confirmed=false;r.season_rank=null;r.month_rank=null;r.up_from=null;r.story=null});
  Tiers.assignTiers(VISIBLE,{T:DATA.tiers,R:DATA.rules,prev:DATA.prev,today:DATA.today,upgrades:DATA.upgrades});
  const byId={}; DATA.archive.forEach(r=>byId[r.id]=r);
  DATA.days.forEach(d=>d.games.forEach(g=>{
    const r=byId[g.id], isFavTeam=!!FAV&&g.teams.some(t=>t.abbr===FAV);
    g.favorite=isFavTeam&&(!r||isHidden(r));
    g.tier=null; g.ss_confirmed=false; g.season_rank=null; g.up_from=null; g.story=null;
    if(r&&!g.favorite){g.tier=r.tier;g.ss_confirmed=r.ss_confirmed;g.season_rank=r.season_rank;g.month_rank=r.month_rank;g.up_from=r.up_from;g.story=r.story}
  }));
}
function topicFor(f){return DATA.topic_prefix+(f?f.toLowerCase():"none")}

function chipClass(s){return s==="欠場"||s==="出場停止"?"out":s==="出場微妙"||s==="出場厳しい"||s==="様子見"?"q":s==="出場濃厚"?"p":""}

function badge(g){
  if(g.favorite) return `<div class="badge fav">🔒<br>推し</div>`;
  if(g.completed){ return tierBadge(g.tier,g.ss_confirmed); }
  return `<div class="badge exp">期待度<br>${"★".repeat(g.expect)}${"☆".repeat(3-g.expect)}</div>`;
}
function tierBadge(t,conf,small){
  if(!t||t==="-") return `<div class="badge none"${small?' style="width:40px;height:40px"':""}>―</div>`;
  const cand=t==="SS"&&!conf;
  return `<div class="badge ${t}"${small?' style="width:40px;height:40px;font-size:16px"':""}>${t}${cand?'<small style="display:block;font-size:9px;font-weight:600;margin-top:-4px">候補</small>':""}</div>`;
}
function tierLine(g){
  if(g.favorite) return favNote(g);
  if(!g.completed||!g.tier) return "";
  const nm=DATA.tier_names[g.tier]||"";
  return `<div class="meta" style="color:var(--text)">${nm}${g.season_rank?`・今季${g.season_rank}位`:""}</div>${upLine(g)}`;
}
function favNote(g){
  // 終わる時刻(残り時間)は出さない。試合の長さ=延長があったかのヒントになるので
  const nm=esc(DATA.teams[FAV]||FAV);
  return g.completed
    ?`<div class="favnote">🔒 推し(${nm})の試合だから、終わってから24時間はランクを隠してるよ。ティア表や通知にも出ない。24時間たつか、<b>見終わったら下のボタン</b>でランクが出る</div>`
    :`<div class="favnote">🔒 推し(${nm})の試合は、終わってから24時間ランクを隠すよ(ネタバレ防止)</div>`;
}
function upLine(r){return r.up_from&&r.up_from!==r.tier?`<div class="meta" style="color:var(--ss)">${r.up_from}→${r.tier}(${esc(r.story)})</div>`:""}
function stateLabel(g){
  if(g.completed) return `<span class="state">終了</span>`;
  if(g.state==="in") return `<span class="state in">試合中</span>`;
  return `<span class="state">${g.start} 開始</span>`;
}
function quick(g){
  const rows=g.teams.slice().reverse().map(t=>{
    const ps=(g.rosters[t.abbr]||[]).filter(p=>p.status&&p.status!=="出場濃厚");
    const chips=ps.length?ps.map(p=>`<span class="chip ${chipClass(p.status)}">${esc(p.name)}:${p.status}${p.detail?`(${esc(p.detail)})`:""}${p.ret?`<small style="display:block;color:var(--sub);font-size:11px">${esc(p.ret)}</small>`:""}</span>`).join(""):`<span class="chip">欠場情報なし</span>`;
    return `<div class="row"><span class="tm">${t.abbr}</span>${chips}</div>`;
  });
  return `<div class="quick">${rows.join("")}</div>`;
}
function roster(g,t){
  const rows=(g.rosters[t.abbr]||[]).map(p=>`<div class="pl"><span class="no">${esc(p.jersey)}</span>${esc(p.name)} <small style="color:var(--sub)">${esc(p.pos)}</small>${p.tier!=="other"?`<span class="tier ${p.tier}">${TIER_SHORT[p.tier]}</span>`:""}${p.status?`<span class="st chip ${chipClass(p.status)}">${p.status}${p.detail?"・"+esc(p.detail):""}${p.ret?"<br>"+esc(p.ret):""}</span>`:""}</div>`).join("");
  return `<div class="roster"><div class="ttl">${esc(t.short)} <small>${t.homeAway==="home"?"ホーム":"アウェイ"}</small></div>${rows}</div>`;
}
function boxTable(rows){
  const head=`<tr><th>選手</th><th>分</th><th>点</th><th>リバ</th><th>アシ</th><th>スティ</th><th>ブロ</th><th>FG</th><th>3P</th><th>FT</th><th>+/-</th></tr>`;
  const body=rows.map(r=>r.dnp?`<tr class="dnp"><td>${esc(r.name)}</td><td colspan="10" style="text-align:left">${r.absent?esc(r.reason):`出場なし${r.reason?"("+esc(r.reason)+")":""}`}</td></tr>`:
    `<tr><td>${r.starter?"<b>":""}${esc(r.name)}${r.starter?"</b>":""}</td><td>${r.MIN}</td><td>${r.PTS}</td><td>${r.REB}</td><td>${r.AST}</td><td>${r.STL}</td><td>${r.BLK}</td><td>${r.FG}</td><td>${r["3PT"]}</td><td>${r.FT}</td><td>${r["+/-"]}</td></tr>`).join("");
  return `<div class="boxwrap"><table>${head}${body}</table></div>`;
}
function resultHTML(g){
  const r=g.result, [h,a]=g.teams;
  const per=(r.linescores[a.abbr]||[]).map((_,i)=>i<4?`${i+1}Q`:`OT${i-3}`);
  const ls=`<div class="boxwrap"><table><tr><th></th>${per.map(p=>`<th>${p}</th>`).join("")}<th>計</th></tr>${[a,h].map(t=>`<tr><td>${t.abbr}</td>${(r.linescores[t.abbr]||[]).map(v=>`<td>${v}</td>`).join("")}<td><b>${r.score[t.abbr]}</b></td></tr>`).join("")}</table></div>`;
  return `<button class="btn" data-act="hide" data-id="${g.id}" style="margin-bottom:10px">結果を閉じる ▴</button>
    <div class="final"><span>${r.score[a.abbr]}<small>${a.abbr}</small></span><span style="color:var(--sub);font-size:18px">-</span><span>${r.score[h.abbr]}<small>${h.abbr}</small></span></div>
    <h3>クォーターごとの得点</h3>${ls}

const MULT_JA={1:"MVP級",0.7:"AS級",0.4:"エース",0.2:"その他"};
const sgn=v=>(v>0?"+":"")+(Math.round(v*10)/10);
function bdRow(title,pts,cap,lines){
  const body=lines.length?`<ul>${lines.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="d" style="padding:4px 0 6px 14px">なし</div>`;
  return `<details><summary><span>${title}</span><b>${sgn(pts)}${cap?`<small> / ${cap}</small>`:""}</b></summary>${body}</details>`;

function clampNote(sec,lines){
  const sum=sec.items.reduce((n,x)=>n+x.pts,0);
  if(sum<0) lines.push(`合計${sum}点だけど、0点より下にはならない`);
  else if(sec.cap&&sum>sec.cap) lines.push(`合計${sum}点だけど、上限の${sec.cap}点で止まる`);
  return lines;
}

function weekKey(d){const x=new Date(d+"T00:00:00Z");const w=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-w);return x.toISOString().slice(0,10)}
function periodsFor(list){
  if(scope==="week") return [...new Set(list.map(r=>weekKey(r.date)))].sort().reverse();
  if(scope==="month") return [...new Set(list.map(r=>r.date.slice(0,7)))].sort().reverse();
  return [];
}
function periodLabel(p){
  if(scope==="week"){const e=new Date(p+"T00:00:00Z");e.setUTCDate(e.getUTCDate()+6);return `${md(p)}〜${md(e.toISOString().slice(0,10))}`}
  if(scope==="month"){const [y,m]=p.split("-");return `${y}年${+m}月`}
  return "";
}
function renderTiers(){
  const all=VISIBLE.filter(r=>stype==="regular"?r.type==="regular":(r.type==="playoff"||r.type==="playin"));
  const seasons=[...new Set(all.map(r=>r.season))].sort().reverse(); const cur=seasons[0];
  let list=all.filter(r=>r.season===cur);
  const sc=[["3days","直近3日"],["week","週"],["month","月"],["season","シーズン"]];
  let head=`<div class="days">${sc.map(([k,l])=>`<button data-act="scope" data-k="${k}" class="${scope===k?"on":""}">${l}</button>`).join("")}</div>
   <div class="days">${[["regular","レギュラーシーズン"],["playoff","プレーオフ"]].map(([k,l])=>`<button data-act="stype" data-k="${k}" class="${stype===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(scope==="3days"){const ds=DATA.days.map(d=>d.date);list=list.filter(r=>ds.includes(r.date))}
  const ps=periodsFor(list);
  if(ps.length){ if(!ps.includes(period)) period=ps[0];
    head+=`<div class="days" style="overflow-x:auto">${ps.slice(0,8).map(p=>`<button data-act="period" data-k="${p}" class="${p===period?"on":""}" style="flex:none;padding:8px 10px">${periodLabel(p)}</button>`).join("")}</div>`;
    list=list.filter(r=>scope==="week"?weekKey(r.date)===period:r.date.slice(0,7)===period);
  }
  const total=list.length;
  list=list.filter(r=>showAll||(r.tier&&r.tier!=="-")).sort(Tiers.compare);
  if(scope==="season"&&!showAll) list=list.slice(0,60);
  head+=`<div class="days"><button data-act="all" class="${showAll?"on":""}">ランク外も表示(この期間 全${total}試合)</button></div>`;
  const order=["SS","S","A","B","C","-"];
  const groups=order.map(t=>{const gs=list.filter(r=>r.tier===t);if(!gs.length)return"";
    return `<h3>${t==="-"?"ランク外":t+":"+DATA.tier_names[t]}(${gs.length})</h3><div class="list">${gs.map(r=>`<div class="item">${tierBadge(r.tier,r.ss_confirmed,1)}<div><div><b>${list.indexOf(r)+1}位</b> ${r.away} @ ${r.home}</div><div class="d">${md(r.date)}・今季${r.season_rank}位</div>${upLine(r)}</div></div>`).join("")}</div>`}).join("");

  const note=favTop+`<div class="legend">ランクは「比べる範囲」で決まる。SS=歴代、S=シーズン、A=月、B=週の中での上位。試合の1日後・7日後・30日後に余韻(どれだけ語られてるか)を測って、順位はそのたびに動くよ。推しチームの試合は、終わってから24時間たつと表に入るよ。</div>`;
  return head+note+(groups||`<div class="empty">この期間はまだランクが付いた試合がないよ</div>`);

    <span style="color:var(--sub)">勝負が決まった後(第4Q残り5分以降で20点差以上)の点は数えない。ただし、そのあと10点差以内まで詰まったら数える。</span>`)}
  ${sec("6. 余韻(民衆の声)",`試合の1日後・7日後・30日後に、ニュースの媒体数・地元以外の媒体数・ハイライト動画の再生数などを測る。人気チームの偏りを抑えるため、同じ夜の試合の中で何番目かに直して使う。一番騒がれたら+15点、一番静かでも−5点まで。殿堂入りはこの「30日後の余韻」で決まる。<br><br><b>名場面ボーナス</b>:切り抜き動画は「KDがポスタライズ」みたいに選手名だけで、しかも色んな人がショートで上げ直して出回るので、主力選手の名前でも探して、ショートと日本語の動画も含めた再生数の合計を見る。それが「そのチームにしては」何倍伸びたか(両チームの過去の試合と比べる)が同じ夜で1位なら+${(DATA.moment||{}).top_bonus??10}点、上位なら+${(DATA.moment||{}).high_bonus??5}点(1日後と7日後に測って大きい方)。`)}
  ${sec("7. 月末の決選投票(民衆が決める)",`毎月2日に、先月のS・Aの試合と「物語」(シーズンを通した50点ゲームの量産や、今まさに燃えている因縁の対決など。めったに出ない)を候補にして、公式Blueskyで投票を始める。<br>
    ・投票は候補の投稿に「いいね」(リポストも1票)<br>
    ・8日の12時に締め切って、上位${(DATA.vote||{}).winners??3}つを1段格上げ(A→S、S→SS候補)<br>
    ・格上げされた試合には「A→S(物語の名前)」みたいに理由が残る<br>
    ・投票が少なすぎたときは、余韻(ニュースや動画の盛り上がり)で代わりに決める<br>
    <span style="color:var(--sub)">SSの殿堂入りは、これまでどおり30日後の余韻で決める。</span>`)}
  ${sec("8. よくある疑問",`<b>Q. ランクが昨日と変わった</b><br>余韻を測ったり、比べる相手の試合が増えたりすると動くよ。<br>
    <b>Q. 推しの試合が出てこない</b><br>終わってから24時間は隠してる。24時間たつか、カードの「見終わった」ボタンを押すと表に入る。<br>
    <b>Q. 開幕直後のランクが辛い気がする</b><br>開幕から1ヶ月は試合数が少ないので、昨季の試合も比べる相手に混ぜてる。<br>
    <b>Q. データはどこから?</b><br>ESPN、Googleニュース、YouTubeなど。1時間ごとに自動更新。`)}`;
}
let postKind="rivalry", postHeat="hot";
function renderPost(){
  const teamOpts=sel=>`<option value="">選ぶ</option>`+Object.entries(DATA.teams).map(([k,n])=>`<option value="${k}"${k===sel?" selected":""}>${esc(n)}</option>`).join("");
  const kinds=[["rivalry","因縁の対決"],["rank","ランクのズレ"],["other","その他"]];
  let form="";
  if(postKind==="rivalry") form=`<label>どのカード?</label><div style="display:flex;gap:6px;align-items:center"><select id="pa">${teamOpts("")}</select><span>×</span><select id="pb">${teamOpts("")}</select></div>
    <label>どんな因縁?</label><div class="seg">${[["hot","今まさに燃えてる"],["tradition","昔からの伝統"]].map(([k,l])=>`<button data-act="heat" data-k="${k}" class="${postHeat===k?"on":""}">${l}</button>`).join("")}</div>
    <div style="color:var(--sub);font-size:12px;margin-top:4px">例:燃えてる=最近のトレードやSNSでのケンカ/伝統=昔の因縁がお約束になったもの</div>
    <label>なぜ因縁なの?(きっかけ・最近の出来事)</label><textarea id="pt" rows="3" maxlength="400"></textarea>`;
  else if(postKind==="rank") form=`<label>どの試合?(例:11/2 TOR@LAL)</label><input type="text" id="pg" maxlength="40">
    <label>どうズレてた?(見た感想。高すぎ・低すぎ・その理由)</label><textarea id="pt" rows="4" maxlength="400"></textarea>`;
  else form=`<label>意見・要望など</label><textarea id="pt" rows="4" maxlength="400"></textarea>`;
  const riv=Object.entries(DATA.rivalries||{}).filter(([k])=>!k.startsWith("_"));
  const sug=Object.entries(DATA.suggested||{}).sort((a,b)=>(b[1].hot+b[1].tradition)-(a[1].hot+a[1].tradition));
  return `<div class="set"><h4>投稿する</h4>
    <div style="color:var(--sub);font-size:13px">アプリをもっと良くするための意見箱。登録なしで誰でも送れるよ。届いたものは持ち主が読んで、採点や因縁リストに反映するか決める。</div>
    <label>種類</label><div class="seg">${kinds.map(([k,l])=>`<button data-act="pkind" data-k="${k}" class="${postKind===k?"on":""}">${l}</button>`).join("")}</div>
    ${form}
    <label>ニックネーム(なくてもOK)</label><input type="text" id="pby" maxlength="20" value="${esc(store.get("nick")||"")}">
    <button class="copy" data-act="send" style="width:100%;margin-top:12px">送る</button>
    <div id="pmsg" style="margin-top:8px;font-size:13px"></div>
    <div style="color:var(--sub);font-size:12px;margin-top:8px">⚠ 試合の結果(スコア・勝敗)は書かないでね(ネタバレ防止)。送った内容は公開の通り道を通るので、本名や連絡先などの個人情報も書かないで。</div></div>
  <div class="set"><h4>登録済みの因縁</h4>${riv.length?riv.map(([k,v])=>`<div style="margin:6px 0"><b>${k.replace("-"," × ")}</b> <span class="chip">${v.type==="hot"?"🔥今燃えてる":"伝統"}</span><br><span style="color:var(--sub);font-size:13px">${esc(v.name)}:${esc(v.why)}</span></div>`).join(""):"まだなし"}
    <div style="color:var(--sub);font-size:12px;margin-top:6px">「今燃えてる」因縁の試合がA以上になると、月末の決選投票で物語の候補になる。</div></div>
  <div class="set"><h4>みんなから届いた因縁の候補</h4>${sug.length?sug.map(([k,v])=>`<div style="margin:4px 0">${k.replace("-"," × ")} <span style="color:var(--sub);font-size:13px">燃えてる${v.hot}票・伝統${v.tradition}票</span></div>`).join(""):`<div style="color:var(--sub)">まだなし(1時間ごとに集計)</div>`}</div>`;
}
function sendPost(btn){
  const v=id=>(document.getElementById(id)||{}).value||"";
  const msg=document.getElementById("pmsg"), by=v("pby").trim();
  const d={kind:postKind,text:v("pt").trim(),by};
  if(postKind==="rivalry"){d.a=v("pa");d.b=v("pb");d.heat=postHeat;
    if(!d.a||!d.b||d.a===d.b){msg.textContent="チームを2つ選んでね";return}}
  else if(postKind==="rank"){d.game=v("pg").trim(); if(!d.text){msg.textContent="どうズレてたか書いてね";return}}
  else if(!d.text){msg.textContent="内容を書いてね";return}
  store.set("nick",by); btn.disabled=true; msg.textContent="送信中…";
  fetch("https://ntfy.sh/"+DATA.suggest_topic,{method:"POST",body:JSON.stringify(d)})
    .then(r=>{if(!r.ok) throw 0; msg.style.color="var(--b)"; msg.textContent="届いたよ、ありがとう!";
      ["pt","pg"].forEach(id=>{const e=document.getElementById(id); if(e) e.value=""})})
    .catch(()=>{msg.style.color="var(--out)"; msg.textContent="送れなかった。電波のいいところでもう一度試してね"})
    .finally(()=>{btn.disabled=false});
}
function renderSettings(){
  const opts=`<option value="">推しなし</option>`+Object.entries(DATA.teams).map(([k,n])=>`<option value="${k}"${k===FAV?" selected":""}>${esc(n)}(${k})</option>`).join("");
  const topic=topicFor(FAV);
  return `<div class="set"><h4>推しチーム</h4>
    <select id="favsel">${opts}</select>
    <div class="favnote" style="margin-top:10px"><b>推しを決めるとこうなる</b><br>
      ・推しの試合は、終わってから<b>24時間</b>ランクを出さない(カードには🔒推しと出る)<br>
      ・その間はティア表・殿堂・通知にも出てこない。ほかの試合の順位も推しを除いて付けるから、順位の抜けからもバレない<br>
      ・24時間たつか、<b>見終わって「見終わった」ボタンを押す(または結果を開く)</b>と、普通にランクが付いて表にも入る<br>
      ・ロスター・欠場情報・結果ボタンはいつも通り使える</div>
    <div style="color:var(--sub);font-size:12px;margin-top:8px">この設定はこのスマホにだけ保存される。</div></div>
  <div class="set"><h4>通知を受け取る(無料アプリ ntfy)</h4>
    <div>9・12・15・18・21時ごろ、SS〜Aの試合を対戦カードとランクだけで通知するよ(中身は書かない)。</div>
    <div class="topic"><code id="topic">${esc(topic)}</code><button class="copy" data-act="copy">コピー</button></div>
    <ol><li>App Store(Androidは Google Play)で「ntfy」を入れる(作者 Philipp Heckel)</li>
      <li>ntfyを開いて右上の「+」</li>
      <li>上のチャンネル名を貼り付けて登録</li></ol>
    <div style="color:var(--sub);font-size:12px;margin-top:8px">推しチームを変えたら、ntfyのチャンネルも登録し直してね(推しの試合を外した通知がチャンネルごとに届く)。</div></div>
  <div class="set"><h4>使い方</h4><button class="copy" data-act="ob" style="width:100%">使い方をもう一度見る</button></div>
  <div class="set"><h4>この端末の情報</h4><div style="color:var(--sub);font-size:13px">推し:${FAV?esc(DATA.teams[FAV]||FAV):"なし"}<br>データ更新:${DATA.generated_at.replace("T"," ")}</div></div>`;
}
// ---- はじめての使い方(最初の1回だけ。設定タブから見直せる) ----
let obStep=0;
function obSteps(){
  const standalone=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  const tiers=["SS","S","A","B","C"].map(t=>`<div class="tierrow"><div class="badge ${t}">${t}</div><div><b>${DATA.tier_names[t]}</b>:${DATA.tier_desc[t]}</div></div>`).join("");
  const opts=`<option value="">推しなし</option>`+Object.entries(DATA.teams).map(([k,n])=>`<option value="${k}"${k===FAV?" selected":""}>${esc(n)}</option>`).join("");
  const steps=[
    ["ようこそ!🏀",`<p>NBAの試合を<b>ネタバレなしで</b>「見るべきかどうか」教えてくれるアプリだよ。</p>
      <ul><li>勝敗やスコアは、<b>自分でボタンを押すまで出ない</b></li><li>代わりに、試合がどれだけ面白かったかを<b>ランク(SS〜C)</b>で教える</li><li>データは1時間ごとに自動で更新</li></ul>`],
    ["ランクの意味",`${tiers}<p style="color:var(--sub);font-size:13px">ランクは比べる範囲で決まるよ(SS=歴代、S=シーズン、A=月、B=週の中での上位)。試合後のニュースや動画の盛り上がり(余韻)でも少しずつ動く。</p>`],
    ["試合タブ",`<ul><li>今日・昨日・おとといの試合が並ぶ</li><li>始まる前は<b>期待度★1〜3</b>、終わったら<b>ランク</b>が出る</li><li>カードの上に<b>欠場・出場微妙の選手</b>と、理由・復帰見込み</li><li>タップするとロスターとチームの強み</li><li>一番下の<b>「結果とスタッツを見る」</b>は、もう一度確認してから表示(うっかり防止)</li></ul>`],
    ["ティア表・殿堂・エース表",`<ul><li><b>ティア表</b>:直近3日・週・月・シーズンでランク順に並ぶ。レギュラーシーズン/プレーオフ切り替え、「ランク外も表示」で全試合</li><li><b>殿堂</b>:何年経っても語られる伝説の試合だけが残る場所</li><li><b>エース表</b>:各チームのエースと格(採点に使ってる)</li></ul>`],
    ["推しチームを選ぼう",`<p>推しの試合は自分で見るはず。だから推しの試合は、<b>終わってから24時間</b>ランク付け・ティア表・通知から外して、ネタバレしないようにするよ。</p>
      <p style="font-size:13px">なので<b>推しの試合だけランクが出なくても故障じゃない</b>よ。カードには「🔒推し」と出て、24時間たつか、見終わってカードの「見終わった」ボタンを押すと普通にランクが付く。</p>
      <select id="obfav" style="width:100%;font-size:16px;padding:10px;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line)">${opts}</select>
      <p style="color:var(--sub);font-size:12px">あとから「設定」タブで変えられる。</p>`],
    ["通知を受け取る(任意)",`<p>9・12・15・18・21時ごろ、SS〜Aの試合を<b>対戦カードとランクだけ</b>で知らせるよ。</p>
      <ol style="padding-left:18px"><li>App Store / Google Playで「<b>ntfy</b>」を入れる</li><li>右上の「+」でこのチャンネル名を登録</li></ol>
      <div class="set" style="margin:8px 0"><div class="topic" style="margin:0"><code id="obtopic">${esc(topicFor(FAV))}</code><button class="copy" data-ob="copy">コピー</button></div></div>
      <p style="color:var(--sub);font-size:12px">チャンネル名は推しチームによって変わる。あとから「設定」タブでも確認できる。</p>`],
  ];
  if(!standalone) steps.push(["ホーム画面に追加",`<p>アプリみたいにアイコンから開けるようになるよ。</p>
      <ul><li><b>iPhone</b>:Safariの共有ボタン(□に↑)→「ホーム画面に追加」</li><li><b>Android</b>:Chromeの右上︙ →「ホーム画面に追加」</li></ul>
      <p style="color:var(--sub);font-size:12px">LINEの中で開いてるときは、右下などのメニューから「Safariで開く」「ブラウザで開く」を選んでから追加してね。ホーム画面から開いたら、推しチームはもう一度選び直してね(保存場所が別になるため)。</p>`]);
  steps.push(["準備完了!",`<p>あとは試合タブを見るだけ。<b>ランクが高い試合から見れば、外れなし</b>。</p><p style="color:var(--sub);font-size:13px">この説明は「設定」タブの「使い方をもう一度見る」からいつでも見られるよ。</p>`]);
  return steps;
}
function showOb(i){
  const st=obSteps(); obStep=Math.max(0,Math.min(i,st.length-1));
  const [t,b]=st[obStep], last=obStep===st.length-1;
  document.getElementById("obbox").innerHTML=`<div class="step">使い方 ${obStep+1}/${st.length}</div><h2>${t}</h2>${b}
    <div class="dots">${st.map((_,k)=>`<i class="${k===obStep?"on":""}"></i>`).join("")}</div>
    <div class="acts">${obStep>0?`<button data-ob="prev">戻る</button>`:""}<button class="pri" data-ob="${last?"done":"next"}">${last?"はじめる":"次へ"}</button></div>
    ${last?"":`<button class="skip" data-ob="done">スキップ</button>`}`;
  document.getElementById("ob").style.display="flex";
}
document.getElementById("ob").addEventListener("click",e=>{
  const b=e.target.closest("[data-ob]"); if(!b) return; const a=b.dataset.ob;
  if(a==="next") showOb(obStep+1);
  else if(a==="prev") showOb(obStep-1);
  else if(a==="done"){document.getElementById("ob").style.display="none";store.set("onboarded","1");render()}
  else if(a==="copy"){const t=document.getElementById("obtopic").textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent="コピーした"}).catch(()=>{b.textContent="長押しでコピー"})}
});
document.getElementById("ob").addEventListener("change",e=>{
  if(e.target.id==="obfav"){FAV=e.target.value;store.set("fav",FAV);store.set("fav_set","1");computeTiers();}
});

function render(){
  if(!DATA) return;
  document.getElementById("upd").textContent="更新 "+DATA.generated_at.slice(5,16).replace("T"," ");
  const m=document.getElementById("main");
  m.innerHTML=view==="day"?renderDay():view==="tiers"?renderTiers():view==="hall"?renderHall():view==="aces"?renderAces():view==="settings"?renderSettings():view==="post"?renderPost():renderHelp();
  loadPendingBd();
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render();window.scrollTo(0,0)});
document.getElementById("main").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const id=el.dataset.id, act=el.dataset.act;
  if(act==="pkind"){postKind=el.dataset.k;render();return}
  if(act==="heat"){postHeat=el.dataset.k;document.querySelectorAll('[data-act="heat"]').forEach(x=>x.classList.toggle("on",x===el));return}
  if(act==="send"){sendPost(el);return}
  if(act==="day"){dayIdx=+el.dataset.i;render();return}
  if(act==="scope"){scope=el.dataset.k;period=null;render();return}
  if(act==="stype"){stype=el.dataset.k;period=null;render();return}
  if(act==="period"){period=el.dataset.k;render();return}
  if(act==="all"){showAll=!showAll;render();return}
  if(act==="ob"){showOb(0);return}
  if(act==="gopost"){view="post";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="post"));render();window.scrollTo(0,0);return}
  if(act==="goset"){view="settings";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v==="settings"));render();window.scrollTo(0,0);return}
  if(act==="copy"){const t=document.getElementById("topic").textContent;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{el.textContent="コピーした"}).catch(()=>{el.textContent="長押しでコピーしてね"});return}
  if(act==="toggle"){document.getElementById("g_"+id).classList.toggle("open");return}
  if(act==="wask"){document.getElementById("wf_"+id).style.display="block";el.style.display="none";return}
  if(act==="wcancel"){document.getElementById("wf_"+id).style.display="none";el.closest(".reveal").querySelector('[data-act="wask"]').style.display="";return}
  if(act==="watched"){store.set("watched_"+id,"1");computeTiers();render();return}
  if(act==="hide"){
    // 閉じたら最初の状態に戻す(もう一度見るときはまた確認する)。推しの試合は見たことになるのでランクは出したまま
    const g=DATA.days.flatMap(d=>d.games).find(x=>x.id===id);
    if(g&&g.teams.some(t=>t.abbr===FAV)) store.set("watched_"+id,"1");
    store.set("seen_"+id,"");
    const rs=document.getElementById("rs_"+id), ask=rs.closest(".reveal").querySelector('[data-act="ask"]');
    rs.innerHTML=""; rs.style.display="none"; if(ask) ask.style.display="";
    document.getElementById("g_"+id)?.scrollIntoView({block:"start"}); return}
  if(act==="ask"){document.getElementById("cf_"+id).style.display="block";el.style.display="none";return}
  if(act==="cancel"){document.getElementById("cf_"+id).style.display="none";el.closest(".reveal").querySelector('[data-act="ask"]').style.display="";return}
  if(act==="show"){
    const g=DATA.days.flatMap(d=>d.games).find(x=>x.id===id);
    const rs=document.getElementById("rs_"+id); rs.innerHTML=resultHTML(g); rs.style.display="block"; loadBd(id);
    document.getElementById("cf_"+id).style.display="none"; store.set("seen_"+id,"1");
    if(g.favorite){computeTiers();render();document.getElementById("g_"+id)?.scrollIntoView({block:"start"})}   // 結果を見た推しの試合はもう隠さない
  }
});
document.getElementById("main").addEventListener("change",e=>{
  if(e.target.id==="favsel"){FAV=e.target.value;store.set("fav",FAV);store.set("fav_set","1");computeTiers();render()}
});
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  try{ if(d.app_ver&&d.app_ver!==APP_VER&&sessionStorage.getItem("reloaded")!==d.app_ver){
    sessionStorage.setItem("reloaded",d.app_ver); location.replace(location.pathname+"?v="+encodeURIComponent(d.app_ver)); return } }catch(e){}
  DATA=d;loadFav();computeTiers();render();if(!store.get("onboarded"))showOb(0)}).catch(()=>{document.getElementById("main").innerHTML='<div class="empty">データを読み込めなかった</div>'});
</script>
</body>
